name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Build and publish Windows desktop release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          path: desktop-source
          fetch-depth: 0

      - name: Resolve official source revision
        id: upstream
        shell: pwsh
        run: |
          $source = Get-Content desktop-source/.github/desktop-upstream.json -Raw | ConvertFrom-Json
          "repository=$($source.repository)" >> $env:GITHUB_OUTPUT
          "commit=$($source.commit)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.upstream.outputs.repository }}
          ref: ${{ steps.upstream.outputs.commit }}
          path: official
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: official/pnpm-lock.yaml

      - name: Apply desktop adaptation
        shell: pwsh
        run: |
          $featurePatch = (Resolve-Path desktop-source/apps/desktop/patches/workspace-file-tree-drag-references.patch).Path
          git -C official apply --check --whitespace=error-all $featurePatch
          if ($LASTEXITCODE -ne 0) { throw 'The workspace-file drag patch does not apply to the pinned official revision.' }
          git -C official apply --whitespace=error-all $featurePatch
          if ($LASTEXITCODE -ne 0) { throw 'Unable to apply the workspace-file drag patch.' }
          Remove-Item official/apps/desktop -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item desktop-source/apps/desktop official/apps/desktop -Recurse -Force
          node desktop-source/apps/desktop/scripts/prepare-release-workspace.mjs official/pnpm-workspace.yaml official/tsconfig.host.json official/tsdown.config.ts
          if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the official workspace for the desktop adaptation.' }
          $client = 'packages/client/ui-settings-general/src/client'
          $files = @(
            'DesktopUpdateSection.module.css',
            'DesktopUpdateSection.tsx',
            'DesktopWindowOpacityRow.module.css',
            'DesktopWindowOpacityRow.tsx',
            'desktop-update-store.ts',
            'desktop-window-bridge.ts',
            'index.ts',
            'locales.ts'
          )
          foreach ($file in $files) {
            Copy-Item "desktop-source/$client/$file" "official/$client/$file" -Force
          }

      - name: Resolve desktop release identity
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content official/apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = node desktop-source/apps/desktop/scripts/advance-upstream.mjs --tag $version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to derive a SemVer-compatible desktop release tag.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop package version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: official
        run: pnpm install --no-frozen-lockfile

      - name: Test desktop shell
        working-directory: official
        env:
          DSH_DESKTOP_SOURCE_ROOT: ${{ github.workspace }}/desktop-source
        run: pnpm --filter @deepseek-ai/dsh-desktop test

      - name: Build Harness
        working-directory: official
        run: pnpm run build:official

      - name: Build Windows installer
        working-directory: official
        run: pnpm --filter @deepseek-ai/dsh-desktop run dist:win

      - name: Verify update assets
        id: assets
        shell: pwsh
        run: |
          $directory = Resolve-Path official/apps/desktop/dist
          $installer = @(Get-ChildItem $directory -File -Filter '*.exe')
          $blockmap = @(Get-ChildItem $directory -File -Filter '*.blockmap')
          $metadata = @(Get-ChildItem $directory -File -Filter 'latest.yml')
          if ($installer.Count -ne 1 -or $blockmap.Count -ne 1 -or $metadata.Count -ne 1) {
            throw "Expected exactly one installer, one blockmap, and latest.yml."
          }
          "installer=$($installer[0].FullName)" >> $env:GITHUB_OUTPUT
          "blockmap=$($blockmap[0].FullName)" >> $env:GITHUB_OUTPUT
          "metadata=$($metadata[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INSTALLER: ${{ steps.assets.outputs.installer }}
          BLOCKMAP: ${{ steps.assets.outputs.blockmap }}
          METADATA: ${{ steps.assets.outputs.metadata }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "DeepSeek Harness Desktop $env:RELEASE_VERSION" --generate-notes --latest
          }
          gh release upload $env:RELEASE_TAG $env:INSTALLER --clobber
          gh release upload $env:RELEASE_TAG $env:BLOCKMAP --clobber
          gh release upload $env:RELEASE_TAG $env:METADATA --clobber
