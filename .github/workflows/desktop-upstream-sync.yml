name: Desktop Upstream Sync

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: desktop-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Detect and dispatch an official desktop update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve official branch head and desktop version
        id: upstream
        shell: pwsh
        run: |
          $source = Get-Content .github/desktop-upstream.json -Raw | ConvertFrom-Json
          $remote = "https://github.com/$($source.repository).git"
          $line = @(git ls-remote $remote "refs/heads/$($source.branch)")
          if ($LASTEXITCODE -ne 0 -or $line.Count -ne 1) {
            throw "Unable to resolve $($source.repository) branch $($source.branch)."
          }
          $latest = ($line[0] -split "\s+")[0]
          if ($latest -notmatch '^[0-9a-f]{40}$') {
            throw "Official branch returned an invalid commit: $latest"
          }
          $packageUrl = "https://raw.githubusercontent.com/$($source.repository)/$latest/apps/desktop/package.json"
          $package = Invoke-RestMethod -Uri $packageUrl
          if ($package.version -isnot [string] -or $package.version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Official desktop package returned an invalid version: $($package.version)"
          }
          "latest=$latest" >> $env:GITHUB_OUTPUT
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "changed=$($latest -ne $source.commit)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Advance pinned revision and desktop version
        if: steps.upstream.outputs.changed == 'true'
        id: advance
        shell: pwsh
        env:
          OFFICIAL_COMMIT: ${{ steps.upstream.outputs.latest }}
          OFFICIAL_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          $version = node apps/desktop/scripts/advance-upstream.mjs $env:OFFICIAL_COMMIT $env:OFFICIAL_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Unable to advance the desktop release identity.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/desktop-upstream.json apps/desktop/package.json
          git commit -m "chore(desktop): advance official harness to ${{ steps.upstream.outputs.latest }}"
          git push origin HEAD:main

      - name: Resolve current release identity
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('${{ steps.upstream.outputs.changed }}' -eq 'true') {
            $version = '${{ steps.advance.outputs.version }}'
          }
          $tag = node apps/desktop/scripts/advance-upstream.mjs --tag $version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to derive a SemVer-compatible desktop release tag.' }
          $exists = node apps/desktop/scripts/github-release-exists.mjs $env:GITHUB_REPOSITORY $tag
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query the desktop release channel.' }
          if ($exists -notin @('true', 'false')) { throw "Desktop release lookup returned an invalid result: $exists" }
          $missing = $exists -eq 'false'
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "missing=$missing".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Dispatch tested desktop release
        if: steps.upstream.outputs.changed == 'true' || steps.release.outputs.missing == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop-release.yml --ref main

      - name: Report current channel
        if: steps.upstream.outputs.changed != 'true' && steps.release.outputs.missing != 'true'
        run: echo 'Desktop release channel already matches the official branch head.'
